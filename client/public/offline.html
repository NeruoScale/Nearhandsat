<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NearHandsAT — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F1EFE7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1A1A17;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .card {
        max-width: 340px;
      }
      .mark {
        width: 56px;
        height: 56px;
        background: #1E2A45;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 20px;
        color: #1E2A45;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: #6B6F76;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        background: #E0912E;
        color: #2A1B04;
        border: none;
        border-radius: 6px;
        padding: 10px 20px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E0912E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>Reconnect to continue using NearHandsAT.</p>
      <button onclick="location.reload()">TRY AGAIN</button>
    </div>
  </body>
</html>
